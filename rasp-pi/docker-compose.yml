services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html
  
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - PYTHONBUFFERED=1
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
      - ./network_data:/app/host_data:rw

  serial:
    build:
      context: .
      dockerfile: serial/Dockerfile
    environment:
      - PYTHONBUFFERED=1
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
    #devices:
    #  - "/dev/serial0:/dev/serial0" # STM32 UART
    #  - "/dev/ttyS0:/dev/ttyS0"
   #  - "/dev/i2c-1:/dev/i2c-1"     # I2C Display

volumes:
  sqlite_data:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.R.T.O. Dashboard</title>
    <!-- Favicon link -->
     <link rel="icon" href="images/borto-icon.svg">
    <!-- Link your local Pico CSS file -->
    <link rel="stylesheet" href="css/pico.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        [data-theme="light"],
        :root:not([data-theme="dark"]) {
                /* Navy Blue Primary (Nav bars, primary buttons, text) */
                --pico-primary: #163a55; 
                --pico-primary-background: #163a55;
                --pico-primary-hover: #0f283b;
                --pico-primary-hover-background: #0f283b;
                --pico-primary-focus: rgba(22, 58, 85, 0.25);
                --pico-primary-inverse: #ffffff;
                
                /* Vibrant Orange Secondary (Active tabs, alerts, chart highlights) */
                --pico-secondary: #e36916;
                --pico-secondary-background: #e36916;
                --pico-secondary-hover: #c25912;
                --pico-secondary-hover-background: #c25912;
                --pico-secondary-focus: rgba(227, 105, 22, 0.25);
                --pico-secondary-inverse: #ffffff;

                --data-background-colour: #dedede;
            }

        [data-theme="dark"] {
                /* Navy Blue Primary (Nav bars, primary buttons, text) */
                --pico-primary: #163a55; 
                --pico-primary-background: #163a55;
                --pico-primary-hover: #0f283b;
                --pico-primary-hover-background: #0f283b;
                --pico-primary-focus: rgba(22, 58, 85, 0.25);
                --pico-primary-inverse: #F5F5F5;
                
                /* Vibrant Orange Secondary (Active tabs, alerts, chart highlights) */
                --pico-secondary: #e36916;
                --pico-secondary-background: #e36916;
                --pico-secondary-hover: #c25912;
                --pico-secondary-hover-background: #c25912;
                --pico-secondary-focus: rgba(227, 105, 22, 0.25);
                --pico-secondary-inverse: #F5F5F5;

                --data-background-colour: #3f3f3f;
            }

        .logos:hover {
            opacity: 0.65;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        .main-banner {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            justify-items: end;
        }

        .metrics-value {
            font-family: "PT Sans", sans-serif;
            font-size: 1.5em;
            align-self: center;
            text-align: center;
        }
    </style>
    <!-- Load chart.js -->
     <script src="chart.umd.js"></script>
    <!-- Load Alpine.js -->
    <script defer src="alpine.min.js"></script>
</head>
<body x-data="bortoMonitor()" x-init="startPolling()">
    <main class="container">
        <!-- Header -->
        <article style="background-color: var(--pico-primary-focus);" class="main-banner" role="grid">
            <a href="#" @click.prevent="activeTab = 'dashboard'" style="justify-self: start; text-decoration: none;">
                <img
                    class="logos" 
                    src="images/borto-logo.svg" 
                    style="height:7em;" 
                />
            </a>
            <div>
                <a href="https://github.com/jtfoote/borto" target="_blank" style="padding: 1em; text-decoration: none;">
                    <img class="logos" src="images/ghlogo.svg" alt="Github Logo" style="height:2em;"/>
                </a>
                <a href="https://sites.google.com/view/theborto" target="_blank" style="text-decoration: none;">
                    <img class="logos" src="images/logo.svg" alt="BBF Logo" style="height:2em;" />
                </a>
            </div>
        </article>
        <div>
            <nav role="grid" style="display: flex; flex-wrap: wrap;">
                <button class="secondary" :class="activeTab === 'dashboard' ? '' : 'outline'" @click="activeTab = 'dashboard'" x-show="activeTab !== 'dashboard'" x-transition>&larr; Home</button>
                <button class="secondary" :class="activeTab === 'metrics' ? '' : 'outline'" @click="activeTab = 'metrics'">Metrics</button>
                <button class="secondary" :class="activeTab === 'settings' ? '' : 'outline'" @click="activeTab = 'settings'">Settings</button>
                <button class="secondary" :class="activeTab === 'troubleshooting' ? '' : 'outline'" @click="activeTab = 'troubleshooting'">Troubleshooting</button>
            </nav>

            <!-- Pages -->
            <section 
                x-show="activeTab === 'dashboard'"
                x-transition.delay.100ms 
                x-transition:enter.duration.250ms
                x-transition:leave.duration.50ms
                >
                <!-- Dashboard UI -->
                <br>
                <div>
                    <article>
                        This is the dashboard!
                        <div role="grid">
                            <div role="group">
                                
                            </div>
                            <div role="group">

                            </div>
                        </div>
                    </article>
                </div>
            </section>

            <section 
                x-show="activeTab === 'metrics'" 
                x-transition.delay.100ms 
                x-transition:enter.duration.250ms
                x-transition:leave.duration.50ms
                >
                 <!-- Charts UI --> 
                <br>
                 <article>
                    <div role="grid">
                        <details name="example">
                            <summary role="button">DC1</summary>
                            <div role="group" style="flex-wrap: wrap;">
                                <article>
                                    <div role="grid">
                                        <header><h3>Average</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="dc1-average-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Current</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="dc1-current-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Maximum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="dc1-maximum-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Minimum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="dc1-minimum-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                            <canvas id="dc1" x-init="
                                    window.dc1_chart = new Chart($el, {
                                        type: 'line',
                                        data: {
                                            labels: [],
                                            datasets: [{
                                                label: 'DC1 Voltage',
                                                data: [],
                                                borderColor: '#e36916',
                                                backgroundColor: 'rgba(227, 105, 22, 0.2)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            },
                                            {
                                                label: 'DC1 Average Voltage',
                                                data: [],
                                                borderColor: '#9abdd6',
                                                borderWidth: 2,
                                                tension: 0.2,
                                                pointStyle: false,
                                            }]
                                        },
                                        options: {
                                            animation: {
                                                duration: 300
                                            }
                                        }
                                    });
                                "></canvas>
                                <div role="group">
                                    <label for="dc1-voltage-toggle">
                                        <input type="checkbox" name="dc1-voltage-toggle" id="dc1-voltage-toggle" role="switch" checked>
                                        Voltage
                                    </label>
                                    <label for="dc1-average-voltage-toggle">
                                        <input type="checkbox" name="dc1-average-voltage-toggle" id="dc1-average-voltage-toggle" role="switch">
                                        Avg. Voltage
                                    </label>
                                </div>
                        </details>
                    <hr />
                    </div>
                    <div role="grid">
                        <details name="example">
                            <summary role="button">Battery</summary>
                            <div role="group" style="flex-wrap: wrap;">
                                <article>
                                    <div role="grid">
                                        <header><h3>Average</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-average-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-average-current">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">A</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Current</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-current-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-current-current">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">A</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Maximum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-maximum-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Minimum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-minimum-voltage">
                                                    25.0
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                            <div style="position: relative; width: 100%;">
                                <canvas id="batt" x-init="
                                    window.batt_chart = new Chart($el, {
                                        type: 'line',
                                        data: {
                                            labels: [],
                                            datasets: [{
                                                label: 'Battery Voltage',
                                                data: [],
                                                borderColor: '#e36916',
                                                backgroundColor: 'rgba(227, 105, 22, 0.2)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            },
                                            {
                                                label: 'Battery Current',
                                                data: [],
                                                borderColor: '#163a55',
                                                backgroundColor: 'rgba(22, 58, 85, 0.25)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            },
                                            {
                                                label: 'Battery Power',
                                                data: [],
                                                borderColor: '#4A7C59',
                                                backgroundColor: 'rgba(74, 124, 89, 0.25)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            }
                                            ]
                                        },
                                        options: {
                                            animation: {
                                                duration: 300
                                            }
                                        }
                                    });
                                "></canvas>
                                <div role="group">
                                    <label for="batt-voltage-toggle">
                                        <input type="checkbox" name="batt-voltage-toggle" id="batt-voltage-toggle" role="switch" checked>
                                        Voltage
                                    </label>
                                    <label for="batt-current-toggle">
                                        <input type="checkbox" name="batt-current-toggle" id="batt-current-toggle" role="switch" checked>
                                        Current
                                    </label>
                                    <label for="batt-power-toggle">
                                        <input type="checkbox" name="batt-power-toggle" id="batt-power-toggle" role="switch" checked>
                                        Power
                                    </label>
                                </div>
                            </div>
                        </details>
                        
                    </div>
                    
                </article>
            </section>
            <section x-show="activeTab === 'settings'"> <!-- Settings UI --> </section>
            <section x-show="activeTab === 'troubleshooting'"> <!-- Troubleshooting UI --> </section>
        </div>
        <label for="theme-toggle">
            <input type="checkbox" name="theme-toggle" id="theme-toggle" role="switch">
            Dark Mode
        </label>
    </main>

    <script>
        let dc1_voltage_toggle = document.getElementById("dc1-voltage-toggle");
        dc1_voltage_toggle.addEventListener('change', () => {
            if (dc1_voltage_toggle.checked) {
                dc1_chart.setDatasetVisibility(0, true);
            } else {
                dc1_chart.setDatasetVisibility(0, false);
            }
            dc1_chart.update();
        })

        let dc1_average_voltage_toggle = document.getElementById("dc1-average-voltage-toggle");
        dc1_average_voltage_toggle.addEventListener('change', () => {
            if (dc1_average_voltage_toggle.checked) {
                dc1_chart.setDatasetVisibility(1, true);
            } else {
                dc1_chart.setDatasetVisibility(1, false);
            }
            dc1_chart.update();
        })

        let batt_voltage_toggle = document.getElementById("batt-voltage-toggle");
        batt_voltage_toggle.addEventListener('change', () => {
            if (batt_voltage_toggle.checked) {
                batt_chart.setDatasetVisibility(0, true);
            } else {
                batt_chart.setDatasetVisibility(0, false);
            }
            batt_chart.update();
        });
        let batt_current_toggle = document.getElementById("batt-current-toggle");
        batt_current_toggle.addEventListener('change', () => {
            if (batt_current_toggle.checked) {
                batt_chart.setDatasetVisibility(1, true);
            } else {
                batt_chart.setDatasetVisibility(1, false);
            }
            batt_chart.update();
        });
        let batt_power_toggle = document.getElementById("batt-power-toggle");
        batt_power_toggle.addEventListener('change', () => {
            if (batt_power_toggle.checked) {
                batt_chart.setDatasetVisibility(2, true);
            } else {
                batt_chart.setDatasetVisibility(2, false);
            }
            batt_chart.update();
        })

        function update_current_dc1(value) {
            let current_dc1_voltage = document.getElementById("dc1-current-voltage");
            current_dc1_voltage.textContent = value.toFixed(1);
            return;
        }

        function update_max_dc1(value) {
            let dc1_voltage_max = document.getElementById("dc1-maximum-voltage");
            if (value > parseFloat(dc1_voltage_max.textContent)) {
                dc1_voltage_max.textContent = value.toFixed(1);
            }
            return;
        }

        function update_min_dc1(value) {
            let dc1_voltage_max = document.getElementById("dc1-minimum-voltage");
            if (value < parseFloat(dc1_voltage_max.textContent)) {
                dc1_voltage_max.textContent = value.toFixed(1);
            }
            return;
        }
        let dc1_value_count = 0;
        let dc1_average_voltage = 0;
        function update_dc1_average(value) {
            dc1_average_voltage = ((dc1_average_voltage * dc1_value_count) + value) / (dc1_value_count + 1);
            dc1_value_count++;
            let dc1_avg = document.getElementById("dc1-average-voltage");
            dc1_avg.textContent = dc1_average_voltage.toFixed(1);

            dc1_chart.data.datasets[1].data.push(dc1_average_voltage);
        }

        function add_voltage_data_to_chart(chart, voltage, timestamp) {
            // Prevent duplicate entries
            if (voltage === chart.data.datasets[0].data.at(-1) &&
                timestamp === chart.data.labels.at(-1)
            )
            {
                console.log("Duplicate voltage values.");
                return;
            }
            
            chart.data.labels.push(timestamp);
            chart.data.datasets[0].data.push(voltage);

            if (chart.data.labels.length > 50) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
            }

            if (chart === dc1_chart) {
                update_current_dc1(voltage);
                update_max_dc1(voltage);
                update_min_dc1(voltage);
                update_dc1_average(voltage);
            }
            chart.update();
        }

        function update_current_batt_values(voltage, current) {
            let current_batt_voltage = document.getElementById("batt-current-voltage");
            current_batt_voltage.textContent = voltage.toFixed(1);
            let current_batt_current = document.getElementById("batt-current-current");
            current_batt_current.textContent = current.toFixed(1);
        }

        let batt_value_count = 0;
        let batt_average_voltage = 0;
        let batt_average_current = 0;
        function update_batt_average(voltage, current) {
            batt_average_voltage = ((batt_average_voltage * batt_value_count) + voltage) / (batt_value_count + 1);
            batt_average_current = ((batt_average_current * batt_value_count) + current) / (batt_value_count + 1);
            batt_value_count++;
            let batt_avg_voltage = document.getElementById("batt-average-voltage");
            let batt_avg_current = document.getElementById("batt-average-current");
            batt_avg_voltage.textContent = batt_average_voltage.toFixed(1);
            batt_avg_current.textContent = batt_average_current.toFixed(1);

            // dc1_chart.data.datasets[1].data.push(dc1_average_voltage);
        }

        function add_battery_data_to_chart(chart, voltage, current, power, timestamp) {
            // Guard clause prevents duplicate data entries 
            if (
                (voltage === chart.data.datasets[0].data.at(-1)) &&
                (current === chart.data.datasets[1].data.at(-1)) &&
                (power === chart.data.datasets[2].data.at(-1)) &&
                (timestamp === chart.data.labels.at(-1))
            )
            {
                console.log("Duplicate battery values");
                return;
            }
            
            chart.data.labels.push(timestamp);
            
            chart.data.datasets[0].data.push(voltage);
            chart.data.datasets[1].data.push(current);
            chart.data.datasets[2].data.push(power);

            if (chart.data.labels.length > 50) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
                chart.data.datasets[2].data.shift();
            }

            update_current_batt_values(voltage, current);
            update_batt_average(voltage, current);

            chart.update();
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('bortoMonitor', () => ({
                activeTab: 'dashboard',
                telemetry: {},
                dc1metrics: {},
                battmetrics: {},
                startPolling() {
                    this.getDC1Metrics();
                    setInterval(() => {
                        this.getDC1Metrics();
                    }, 500); 
                    this.getBattMetrics();
                    setInterval(() => {
                        this.getBattMetrics();
                    }, 500);
                },
                async getDC1Metrics () {
                    try {
                        const dc1response = await fetch('/api/metrics/dc1');
                        if (dc1response.ok) {
                            this.dc1metrics = await dc1response.json();
                        }
                        let time = this.dc1metrics[0].timestamp.substring(11,19);
                        add_voltage_data_to_chart(
                                dc1_chart, 
                                this.dc1metrics[0].voltage_value,
                                time,
                            );
                    } catch (error) {
                        console.error('DC1 Metrics could not be read:', error);
                    }
                },
                async getBattMetrics () {
                    try {
                        const battresponse = await fetch('/api/metrics/batt');
                        if (battresponse.ok) {
                            this.battmetrics = await battresponse.json();
                        }
                        let time = this.battmetrics[0].timestamp.substring(11,19);
                        add_battery_data_to_chart(
                                batt_chart, 
                                this.battmetrics[0].voltage_value,
                                this.battmetrics[0].current_value,
                                this.battmetrics[0].voltage_value * this.battmetrics[0].current_value,
                                time,
                            );
                    } catch (error) {
                        console.error('Battery Metrics could not be read:', error);
                    }
                },
            }))
        });

        const toggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Determine user's theme
        const saved_theme = localStorage.getItem('theme');
        const prefers_dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (saved_theme === 'dark' || (!saved_theme && prefers_dark)) {
            html.setAttribute('data-theme', 'dark');
            toggle.checked = true;
        } else {
            html.setAttribute('data-theme', 'light');
            toggle.checked = false;
        }

        // Listen for toggle switch
        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>

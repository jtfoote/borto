<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.R.T.O. Dashboard</title>
    <!-- Favicon link -->
     <link rel="icon" href="images/borto-icon.svg">
    <!-- Link your local Pico CSS file -->
    <link rel="stylesheet" href="css/pico.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        [data-theme="light"],
        :root:not([data-theme="dark"]) {
                /* Navy Blue Primary (Nav bars, primary buttons, text) */
                --pico-primary: #163a55; 
                --pico-primary-background: #163a55;
                --pico-primary-hover: #0f283b;
                --pico-primary-hover-background: #0f283b;
                --pico-primary-focus: rgba(22, 58, 85, 0.25);
                --pico-primary-inverse: #ffffff;
                
                /* Vibrant Orange Secondary (Active tabs, alerts, chart highlights) */
                --pico-secondary: #e36916;
                --pico-secondary-background: #e36916;
                --pico-secondary-hover: #c25912;
                --pico-secondary-hover-background: #c25912;
                --pico-secondary-focus: rgba(227, 105, 22, 0.25);
                --pico-secondary-inverse: #ffffff;

                --data-background-colour: #dedede;

                --charging-background: #9abdd6;
                --charging-outline: #9abdd6;
                --discharging-background: #5ca976;
                --discharging-outline: #5ca976;
                --error-background: #d65b5b87;
                --error-outline: #d65b5b;
            }

        [data-theme="dark"] {
                /* Navy Blue Primary (Nav bars, primary buttons, text) */
                --pico-primary: #163a55; 
                --pico-primary-background: #163a55;
                --pico-primary-hover: #0f283b;
                --pico-primary-hover-background: #0f283b;
                --pico-primary-focus: rgba(22, 58, 85, 0.25);
                --pico-primary-inverse: #F5F5F5;
                
                /* Vibrant Orange Secondary (Active tabs, alerts, chart highlights) */
                --pico-secondary: #e36916;
                --pico-secondary-background: #e36916;
                --pico-secondary-hover: #c25912;
                --pico-secondary-hover-background: #c25912;
                --pico-secondary-focus: rgba(227, 105, 22, 0.25);
                --pico-secondary-inverse: #F5F5F5;

                --data-background-colour: #3f3f3f;

                --charging-background: #82b0d47c;
                --charging-outline: #9abdd6;
                --discharging-background: #69c287;
                --discharging-outline: #5ca976;
                --error-background: ##e06b6b;
                --error-outline: #d65b5b;
            }

        .logos:hover {
            opacity: 0.65;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        .main-banner {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            justify-items: end;
        }

        .metrics-value {
            font-family: "PT Sans", sans-serif;
            font-size: 1.5em;
            align-self: center;
            text-align: center;
        }

        .borto-charging {
            outline: var(--charging-outline) 1px;
        }

        .borto-status-logo {
            display: flex;

        }

        .charging-bar {
            opacity: 0;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: steps(1); /* Snaps visibility cleanly */
        }

        .bar-1 { animation-name: charge-1; }
        .bar-2 { animation-name: charge-2; }
        .bar-3 { animation-name: charge-3; }
        .bar-4 { animation-name: charge-4; }

        /* Bar 1 appears at 0%, stays visible until 85%, then turns off */
        @keyframes charge-1 {
            0%, 85% { opacity: 1; }
            86%, 100% { opacity: 0; }
        }

        /* Bar 2 appears at 25%, turns off at 85% */
        @keyframes charge-2 {
            0%, 24% { opacity: 0; }
            25%, 85% { opacity: 1; }
            86%, 100% { opacity: 0; }
        }

        /* Bar 3 appears at 50%, turns off at 85% */
        @keyframes charge-3 {
            0%, 49% { opacity: 0; }
            50%, 85% { opacity: 1; }
            86%, 100% { opacity: 0; }
        }

        /* Bar 4 appears at 75%, turns off at 85% */
        @keyframes charge-4 {
            0%, 74% { opacity: 0; }
            75%, 85% { opacity: 1; }
            86%, 100% { opacity: 0; }
        }
    </style>
    <script src="app.js" defer></script>
    <!-- Load chart.js -->
     <script src="chart.umd.js"></script>
    <!-- Load Alpine.js -->
    <script defer src="alpine.min.js"></script>
</head>
<body x-data="bortoMonitor()" x-init="startPolling()">
    <main class="container" x-show="!connected" x-data="wifiManager()">
        <article style="background-color: var(--pico-primary-focus);" class="main-banner" role="grid">
            <a href="#" @click.prevent="activeTab = 'dashboard'" style="justify-self: start; text-decoration: none;">
                <img
                    class="logos" 
                    src="images/borto-logo.svg" 
                    style="height:7em;" 
                />
            </a>
            <div>
                <a href="https://github.com/jtfoote/borto" target="_blank" style="padding: 1em; text-decoration: none;">
                    <img class="logos" src="images/ghlogo.svg" alt="Github Logo" style="height:2em;"/>
                </a>
                <a href="https://sites.google.com/view/theborto" target="_blank" style="text-decoration: none;">
                    <img class="logos" src="images/logo.svg" alt="BBF Logo" style="height:2em;" />
                </a>
            </div>
        </article>
        <article role="grid">
            <h2>Connect to a Wifi Network</h2>
            <input type="text" x-model="ssid" placeholder="Network Name">
            <input type="password" x-model="password" placeholder="Password">

            <button @click="connectToWifi" x-text="connecting ? 'Connecting...' : 'Connect'" :disabled="connecting || !ssid">
            </button>
        </article>
    </main>
    <main class="container" x-show="connected">
        <!-- Header -->
        <article style="background-color: var(--pico-primary-focus);" class="main-banner" role="grid">
            <a href="#" @click.prevent="activeTab = 'dashboard'" style="justify-self: start; text-decoration: none;">
                <img
                    class="logos" 
                    src="images/borto-logo.svg" 
                    style="height:7em;" 
                />
            </a>
            <div>
                <a href="https://github.com/jtfoote/borto" target="_blank" style="padding: 1em; text-decoration: none;">
                    <img class="logos" src="images/ghlogo.svg" alt="Github Logo" style="height:2em;"/>
                </a>
                <a href="https://sites.google.com/view/theborto" target="_blank" style="text-decoration: none;">
                    <img class="logos" src="images/logo.svg" alt="BBF Logo" style="height:2em;" />
                </a>
            </div>
        </article>
        <div>
            <nav role="grid" style="display: flex; flex-wrap: wrap;">
                <button class="secondary" :class="activeTab === 'dashboard' ? '' : 'outline'" @click="activeTab = 'dashboard'" x-show="activeTab !== 'dashboard'" x-transition>&larr; Home</button>
                <button class="secondary" :class="activeTab === 'metrics' ? '' : 'outline'" @click="activeTab = 'metrics'">Metrics</button>
                <button class="secondary" :class="activeTab === 'settings' ? '' : 'outline'" @click="activeTab = 'settings'">Settings</button>
                <button class="secondary" :class="activeTab === 'troubleshooting' ? '' : 'outline'" @click="activeTab = 'troubleshooting'">Troubleshooting</button>
            </nav>

            <!-- Pages -->
            <section 
                x-show="activeTab === 'dashboard'"
                x-transition.delay.100ms 
                x-transition:enter.duration.250ms
                x-transition:leave.duration.50ms
                >
                <!-- Dashboard UI -->
                <br>
                <div>
                    <article>
                        <div role="grid">
                            <article x-show="battstatus == 0" style="background-color: var(--error-background);outline:solid var(--error-outline) thin;">
                                <div role="group" class="borto-status" style="display:grid;grid-template-columns: 2fr 1fr;padding-top: 1em;">
                                    <div class="borto-status-logo">
                                        <img src="images/borto-logo-no-text.svg" alt="BORTO" style="height:2em;padding-right:0.5em;"  />
                                        <h3 class="status-text">Status:</h3>
                                    </div>
                                    <div role="group">
                                        <h2 id="borto-status" class="status-text" style="font-size: 3em;">ERROR</h2>
                                    </div>
                                </div>
                            </article>
                            <article x-show="battstatus == 1" style="background-color: var(--charging-background);outline:solid var(--charging-outline) thin;">
                                <div role="group" class="borto-status" style="display:grid;grid-template-columns: 2fr 1fr;padding-top: 1em;">
                                    <div class="borto-status-logo">
                                        <img src="images/borto-logo-no-text.svg" alt="BORTO" style="height:2em;padding-right:0.5em;" />
                                        <h3 class="status-text">Status:</h3>
                                    </div>
                                    <div role="group">
                                        <h2 id="borto-status" class="status-text" style="font-size: 3em;">CHARGING</h2>
                                        <svg width="41" height="75" xmlns="http://www.w3.org/2000/svg">
                                            <rect x="3" y="6" width="35" height="65" rx="6" stroke="#dc6b0d" stroke-width="5" fill="none"/>
                                            <rect x="14" y="2" width="13" height="3" rx="5" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-4" x="11.4" y="16" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-3" x="11.4" y="29" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-2" x="11.4" y="43" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-1" x="11.4" y="57" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                        </svg>
                                    </div>
                                </div>
                            </article>
                            <article x-show="battstatus == 2" style="background-color: var(--discharging-background);outline:solid var(--discharging-outline) thin;">
                                <div role="group" class="borto-status" style="display:grid;grid-template-columns: 2fr 1fr;padding-top: 1em;">
                                    <div class="borto-status-logo">
                                        <img src="images/borto-logo-no-text.svg" alt="BORTO" style="height:2em;padding-right:0.5em;" />
                                        <h3 class="status-text">Status:</h3>
                                    </div>
                                    <div role="group">
                                        <h2 id="borto-status" class="status-text" style="font-size: 3em;">DISCHARGING</h2>
                                        <svg width="41" height="75" xmlns="http://www.w3.org/2000/svg">
                                            <rect x="3" y="6" width="35" height="65" rx="6" stroke="#dc6b0d" stroke-width="5" fill="none"/>
                                            <rect x="14" y="2" width="13" height="3" rx="5" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-4" x="11.4" y="16" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-3" x="11.4" y="29" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-2" x="11.4" y="43" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                            <rect class="charging-bar bar-1" x="11.4" y="57" width="18" height="2" rx="1" stroke="#dc6b0d" stroke-width="5" fill="#dc6b0d"/>
                                        </svg>
                                    </div>
                                </div>
                            </article>
                            <div role="group">

                            </div>
                        </div>
                    </article>
                </div>
            </section>

            <section 
                x-show="activeTab === 'metrics'" 
                x-transition.delay.100ms 
                x-transition:enter.duration.250ms
                x-transition:leave.duration.50ms
                >
                 <!-- Charts UI --> 
                <br>
                 <article>
                    <div role="grid">
                        <details name="example">
                            <summary role="button">DC1</summary>
                            <div role="group" style="flex-wrap: wrap;">
                                <article>
                                    <div role="grid">
                                        <header><h3>Average</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" x-text="dc1_average_voltage">
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Current</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" x-text="dc1_current_voltage">
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Maximum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" x-text="dc1_max_voltage">
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Minimum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" x-text="dc1_min_voltage">
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                            <canvas id="dc1" x-init="
                                    window.dc1_chart = new Chart($el, {
                                        type: 'line',
                                        data: {
                                            labels: [],
                                            datasets: [{
                                                label: 'DC1 Voltage',
                                                data: [],
                                                borderColor: '#e36916',
                                                backgroundColor: 'rgba(227, 105, 22, 0.2)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            },
                                            {
                                                label: 'DC1 Average Voltage',
                                                data: [],
                                                borderColor: '#9abdd6',
                                                borderWidth: 2,
                                                tension: 0.2,
                                                pointStyle: false,
                                            }]
                                        },
                                        options: {
                                            animation: {
                                                duration: 300
                                            }
                                        }
                                    });
                                "></canvas>
                                <div role="group">
                                    <label for="dc1-voltage-toggle">
                                        <input type="checkbox" name="dc1-voltage-toggle" id="dc1-voltage-toggle" role="switch" checked>
                                        Voltage
                                    </label>
                                    <label for="dc1-average-voltage-toggle">
                                        <input type="checkbox" name="dc1-average-voltage-toggle" id="dc1-average-voltage-toggle" role="switch">
                                        Avg. Voltage
                                    </label>
                                </div>
                        </details>
                    <hr />
                    </div>
                    <div role="grid">
                        <details name="example">
                            <summary role="button">Battery</summary>
                            <div role="group" style="flex-wrap: wrap;">
                                <article>
                                    <div role="grid">
                                        <header><h3>Average</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-average-voltage">
                                                    --
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-average-current">
                                                    --
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">A</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Current</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-current-voltage">
                                                    --
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-current-current">
                                                    --
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">A</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Maximum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-maximum-voltage">
                                                    --
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                                <article>
                                    <div role="grid">
                                        <header><h3>Minimum</h3></header>
                                        <div style="display:grid; grid-template-columns: 1fr 2fr;">
                                            <article style="padding: 0; background-color: var(--data-background-colour); border-radius: 25px;">
                                                <p class="metrics-value" style="padding-top:0.5em;" id="batt-minimum-voltage">
                                                    --
                                                </p>
                                            </article>
                                            <p class="metrics-value" style="text-align: left; padding-left: 0.5em;">V</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                            <div style="position: relative; width: 100%;">
                                <canvas id="batt" x-init="
                                    window.batt_chart = new Chart($el, {
                                        type: 'line',
                                        data: {
                                            labels: [],
                                            datasets: [{
                                                label: 'Battery Voltage',
                                                data: [],
                                                borderColor: '#e36916',
                                                backgroundColor: 'rgba(227, 105, 22, 0.2)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            },
                                            {
                                                label: 'Battery Current',
                                                data: [],
                                                borderColor: '#163a55',
                                                backgroundColor: 'rgba(22, 58, 85, 0.25)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            },
                                            {
                                                label: 'Battery Power',
                                                data: [],
                                                borderColor: '#4A7C59',
                                                backgroundColor: 'rgba(74, 124, 89, 0.25)',
                                                borderWidth: 2,
                                                tension: 0.1
                                            }
                                            ]
                                        },
                                        options: {
                                            animation: {
                                                duration: 300
                                            }
                                        }
                                    });
                                "></canvas>
                                <div role="group">
                                    <label for="batt-voltage-toggle">
                                        <input type="checkbox" name="batt-voltage-toggle" id="batt-voltage-toggle" role="switch" checked>
                                        Voltage
                                    </label>
                                    <label for="batt-current-toggle">
                                        <input type="checkbox" name="batt-current-toggle" id="batt-current-toggle" role="switch" checked>
                                        Current
                                    </label>
                                    <label for="batt-power-toggle">
                                        <input type="checkbox" name="batt-power-toggle" id="batt-power-toggle" role="switch" checked>
                                        Power
                                    </label>
                                </div>
                            </div>
                        </details>
                        
                    </div>
                    
                </article>
            </section>
            <section x-show="activeTab === 'settings'"> <!-- Settings UI --> </section>
            <section x-show="activeTab === 'troubleshooting'"> <!-- Troubleshooting UI --> </section>
        </div>
        <label for="theme-toggle">
            <input type="checkbox" name="theme-toggle" id="theme-toggle" role="switch">
            Dark Mode
        </label>
        <hr>
        <div role="group">
            <label for="status-override">
                <input type="checkbox" name="status-override" id="status-override" role="switch" x-model="manual_status_override" unchecked>
                Status Manual Override
            </label>
            <label for="status">
                <input type="number" name="status" id="status" x-model.number="battstatus">
                Status Code
            </label>
        </div>

    </main>

    <script>
        const toggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Determine user's theme
        const saved_theme = localStorage.getItem('theme');
        const prefers_dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (saved_theme === 'dark' || (!saved_theme && prefers_dark)) {
            html.setAttribute('data-theme', 'dark');
            toggle.checked = true;
        } else {
            html.setAttribute('data-theme', 'light');
            toggle.checked = false;
        }

        // Listen for toggle switch
        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>

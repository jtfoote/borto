<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.R.T.O. Dashboard</title>
    <!-- Favicon link -->
     <link rel="icon" href="images/borto-icon.svg">
    <!-- Link your local Pico CSS file -->
    <link rel="stylesheet" href="css/pico.min.css">
    <style>
        [data-theme="light"],
        :root:not([data-theme="dark"]) {
                /* Navy Blue Primary (Nav bars, primary buttons, text) */
                --pico-primary: #163a55; 
                --pico-primary-background: #163a55;
                --pico-primary-hover: #0f283b;
                --pico-primary-hover-background: #0f283b;
                --pico-primary-focus: rgba(22, 58, 85, 0.25);
                --pico-primary-inverse: #ffffff;
                
                /* Vibrant Orange Secondary (Active tabs, alerts, chart highlights) */
                --pico-secondary: #e36916;
                --pico-secondary-background: #e36916;
                --pico-secondary-hover: #c25912;
                --pico-secondary-hover-background: #c25912;
                --pico-secondary-focus: rgba(227, 105, 22, 0.25);
                --pico-secondary-inverse: #ffffff;
            }

        [data-theme="dark"] {
                /* Navy Blue Primary (Nav bars, primary buttons, text) */
                --pico-primary: #163a55; 
                --pico-primary-background: #163a55;
                --pico-primary-hover: #0f283b;
                --pico-primary-hover-background: #0f283b;
                --pico-primary-focus: rgba(22, 58, 85, 0.25);
                --pico-primary-inverse: #F5F5F5;
                
                /* Vibrant Orange Secondary (Active tabs, alerts, chart highlights) */
                --pico-secondary: #e36916;
                --pico-secondary-background: #e36916;
                --pico-secondary-hover: #c25912;
                --pico-secondary-hover-background: #c25912;
                --pico-secondary-focus: rgba(227, 105, 22, 0.25);
                --pico-secondary-inverse: #F5F5F5;
            }

        .logos:hover {
            opacity: 0.65;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        .main-banner {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            justify-items: end;
        }
    </style>
    <!-- Load chart.js -->
     <script src="chart.umd.js"></script>
    <!-- Load Alpine.js -->
    <script defer src="alpine.min.js"></script>
</head>
<body x-data="bortoMonitor()" x-init="startPolling()">
    <main class="container">
        <!-- Header -->
        <article style="background-color: var(--pico-primary-focus);" class="main-banner" role="grid">
            <a href="#" @click.prevent="activeTab = 'dashboard'" style="justify-self: start; text-decoration: none;">
                <img
                    class="logos" 
                    src="images/borto-logo.svg" 
                    style="height:7em;" 
                />
            </a>
            <div x-data="{ activeTab: 'dashboard'}">
                <a href="https://github.com/jtfoote/borto" target="_blank" style="padding: 1em; text-decoration: none;">
                    <img class="logos" src="images/GitHub_Invertocat_Black.svg" alt="Github Logo" style="height:2em;"/>
                </a>
                <a href="https://sites.google.com/view/theborto" target="_blank" style="text-decoration: none;">
                    <img class="logos" src="images/logo.svg" alt="BBF Logo" style="height:2em;" />
                </a>
            </div>
        </article>
        <div>
            <nav role="grid" style="display: flex; flex-wrap: wrap;">
                <button class="secondary" :class="activeTab === 'dashboard' ? '' : 'outline'" @click="activeTab = 'dashboard'" x-show="activeTab !== 'dashboard'" x-transition>&larr; Home</button>
                <button class="secondary" :class="activeTab === 'metrics' ? '' : 'outline'" @click="activeTab = 'metrics'">Metrics</button>
                <button class="secondary" :class="activeTab === 'settings' ? '' : 'outline'" @click="activeTab = 'settings'">Settings</button>
                <button class="secondary" :class="activeTab === 'troubleshooting' ? '' : 'outline'" @click="activeTab = 'troubleshooting'">Troubleshooting</button>
            </nav>

            <!-- Pages -->
            <section 
                x-show="activeTab === 'dashboard'"
                x-transition.delay.100ms 
                x-transition:enter.duration.250ms
                x-transition:leave.duration.50ms
                >
                <!-- Dashboard UI -->
                <div>
                    <article>
                        This is the dashboard!
                    </article>
                </div>
            </section>

            <section 
                x-show="activeTab === 'metrics'" 
                x-transition.delay.100ms 
                x-transition:enter.duration.250ms
                x-transition:leave.duration.50ms
                >
                 <!-- Charts UI --> 
                <article>
                    <div role="grid">
                        <canvas id="dc1voltage" x-init="
                            window.dc1_voltage_chart = new Chart($el, {
                                type: 'line',
                                data: {
                                    labels: [],
                                    datasets: [{
                                        label: 'DC1 Voltage',
                                        data: [],
                                        borderColor: '#e36916',
                                        backgroundColor: 'rgba(227, 105, 22, 0.2)',
                                        borderWidth: 2
                                    },
                                    {
                                        label: 'DC1 Current',
                                        data: [],
                                        borderColor: '#163a55',
                                        backgroundColor: 'rgba(22, 58, 85, 0.25)',
                                        borderWidth: 2
                                    }]
                                }
                            });
                        "></canvas>
                    </div>
                    
                </article>
            </section>
            <section x-show="activeTab === 'settings'"> <!-- Settings UI --> </section>
            <section x-show="activeTab === 'troubleshooting'"> <!-- Troubleshooting UI --> </section>
        </div>
        <!-- Alpine.js component: initializes data and sets up a 1-second polling loop -->
        <div>
            <article>
                <header>
                    <strong>System Status: </strong>
                    <span x-text="telemetry.status || 'Waiting for data...'"></span>
                </header>
                
                <div class="grid">
                    <div>
                        <p><strong>Location:</strong> <span x-text="telemetry.value_location"></span></p>
                    </div>
                    <div>
                        <p><strong>Type:</strong> <span x-text="telemetry.value_type"></span></p>
                    </div>
                    <div>
                        <p><strong>Value:</strong> <span x-text="telemetry.value"></span></p>
                    </div>
                </div>
            </article>
        </div>
        <label for="theme-toggle">
            <input type="checkbox" name="theme-toggle" id="theme-toggle" role="switch">
            Dark Mode
        </label>
    </main>

    <script>

        function add_data_to_chart(chart, new_label, new_value, data_type) {

            chart.update();
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('bortoMonitor', () => ({
                activeTab: 'dashboard',
                telemetry: {},
                dc1metrics: {},
                startPolling() {
                    this.fetchMetrics();
                    setInterval(() => this.fetchMetrics(), 500);
                    this.getDC1Metrics();
                    setInterval(() => {
                        this.getDC1Metrics();
                    }, 500); 
                },
                async fetchMetrics() {
                    try {
                        const response = await fetch('/api/metrics/latest');
                        if (response.ok) {
                            this.telemetry = await response.json();
                        }
                    } catch (error) {
                        console.error('Connection to backend lost:', error);
                    }
                },
                async getDC1Metrics () {
                    try {
                        const dc1response = await fetch('/api/metrics/dc1');
                        if (dc1response.ok) {
                            this.dc1metrics = await dc1response.json();
                        }
                        for (let i = 0; i < this.dc1metrics.values.length; i++) {
                            console.log(this.dc1metrics.values[i]);
                        }
                    } catch (error) {
                        console.error('DC1 Metrics could not be read:', error);
                    }
                }
            }))
        });

        const toggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Determine user's theme
        const saved_theme = localStorage.getItem('theme');
        const prefers_dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (saved_theme === 'dark' || (!saved_theme && prefers_dark)) {
            html.setAttribute('data-theme', 'dark');
            toggle.checked = true;
        } else {
            html.setAttribute('data-theme', 'light');
            toggle.checked = false;
        }

        // Listen for toggle switch
        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
